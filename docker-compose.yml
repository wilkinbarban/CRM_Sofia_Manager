services:
  web:
    image: ${ASADOS_WEB_IMAGE:-asados-web:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: crm-sofia-web
    restart: always
    ports:
      - "127.0.0.1:3020:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=https://crmsofiamanager.duckdns.org
      - NEXT_PUBLIC_SUPABASE_URL=https://crmsofiamanager.duckdns.org
      - SUPABASE_INTERNAL_URL=http://api-gw:8000
      # Payment-proof operational gates are process-startup-only and closed by default.
      - PAYMENT_PROOF_CANONICAL_INGEST_ENABLED=${PAYMENT_PROOF_CANONICAL_INGEST_ENABLED:-false}
      - WHATSAPP_PAYMENT_PROOF_INGEST_ENABLED=${WHATSAPP_PAYMENT_PROOF_INGEST_ENABLED:-false}
      - TELEGRAM_PAYMENT_PROOF_INGEST_ENABLED=${TELEGRAM_PAYMENT_PROOF_INGEST_ENABLED:-false}
      - PAYMENT_PROOF_PROCESSING_ENABLED=${PAYMENT_PROOF_PROCESSING_ENABLED:-false}
      - PAYMENT_PROOF_SELLER_RECONCILIATION_ENABLED=${PAYMENT_PROOF_SELLER_RECONCILIATION_ENABLED:-false}
      - PAYMENT_PROOF_PRIVILEGED_REPLAY_ENABLED=${PAYMENT_PROOF_PRIVILEGED_REPLAY_ENABLED:-false}
      - PAYMENT_PROOF_CLEANUP_ENABLED=${PAYMENT_PROOF_CLEANUP_ENABLED:-false}
      # Web action boundary only; database RPC authorization remains independently admin-only.
      - PAYMENT_PROOF_RESTORE_ENABLED=${PAYMENT_PROOF_RESTORE_ENABLED:-false}
      # Notification delivery is at-least-once; gates stay closed until explicitly enabled.
      - NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      - WEB_NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${WEB_NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      - WHATSAPP_NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${WHATSAPP_NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      - TELEGRAM_NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${TELEGRAM_NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      # Sofia inbound batching gates are process-startup-only and closed by default.
      - SOFIA_INBOUND_BATCH_PROCESSING_ENABLED=${SOFIA_INBOUND_BATCH_PROCESSING_ENABLED:-false}
      - SOFIA_INBOUND_BATCH_RUNTIME_ENABLED=${SOFIA_INBOUND_BATCH_RUNTIME_ENABLED:-false}
      - SOFIA_INBOUND_BATCH_TELEGRAM_ENQUEUE_ENABLED=${SOFIA_INBOUND_BATCH_TELEGRAM_ENQUEUE_ENABLED:-false}
      - SOFIA_INBOUND_BATCH_EVOLUTION_ENQUEUE_ENABLED=${SOFIA_INBOUND_BATCH_EVOLUTION_ENQUEUE_ENABLED:-false}
      # Customer memory gate is process-startup-only and closed by default.
      - SOFIA_CUSTOMER_MEMORY_ENABLED=${SOFIA_CUSTOMER_MEMORY_ENABLED:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      com.asados.health.liveness: "http://127.0.0.1:3000/api/health/live"
      com.asados.health.readiness: "http://127.0.0.1:3000/api/health/ready"
    networks:
      app-private:
        aliases:
          - asados-web
          - crm-sofia-web
      supabase-private:
      portafolio-net:
        aliases:
          - asados-web
          - crm-sofia-web

  mercado-pago-recovery:
    image: alpine:3.20
    container_name: asados-mercado-pago-recovery
    restart: always
    environment:
      - MERCADO_PAGO_RECOVERY_SECRET=${MERCADO_PAGO_RECOVERY_SECRET:?set MERCADO_PAGO_RECOVERY_SECRET}
      - MERCADO_PAGO_RECOVERY_URL=http://web:3000/api/internal/mercadopago/recover
      - MERCADO_PAGO_RECOVERY_INTERVAL_SECONDS=${MERCADO_PAGO_RECOVERY_INTERVAL_SECONDS:-60}
    command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec /scheduler/mercadopago-recovery-scheduler.sh"]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./ops/mercadopago-recovery-scheduler.sh:/scheduler/mercadopago-recovery-scheduler.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/mercado-pago-recovery-last-success"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    networks:
      - app-private

  payment-proof-maintenance:
    image: alpine:3.20
    container_name: asados-payment-proof-maintenance
    restart: always
    environment:
      - PAYMENT_PROOF_MAINTENANCE_SECRET=${PAYMENT_PROOF_MAINTENANCE_SECRET:?set PAYMENT_PROOF_MAINTENANCE_SECRET}
      - PAYMENT_PROOF_MAINTENANCE_URL=http://web:3000/api/internal/payment-proofs/maintenance
      - PAYMENT_PROOF_METRICS_SECRET=${PAYMENT_PROOF_METRICS_SECRET:?set PAYMENT_PROOF_METRICS_SECRET}
      - PAYMENT_PROOF_ALERT_URL=http://web:3000/api/internal/payment-proofs/alerts
      - PAYMENT_PROOF_MAINTENANCE_INTERVAL_SECONDS=${PAYMENT_PROOF_MAINTENANCE_INTERVAL_SECONDS:-60}
    command: ["/bin/sh","-c","apk add --no-cache curl >/dev/null && exec /scheduler/payment-proof-maintenance-scheduler.sh"]
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - ./ops/payment-proof-maintenance-scheduler.sh:/scheduler/payment-proof-maintenance-scheduler.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          interval=$${PAYMENT_PROOF_MAINTENANCE_INTERVAL_SECONDS:-60};
          case "$$interval" in ''|*[!0-9]*) interval=60;; *)
          if [ "$$interval" -lt 1 ] || [ "$$interval" -gt 715827882 ]; then interval=60; fi;; esac;
          tolerance=$$((interval * 3));
          if [ "$$tolerance" -lt 180 ]; then tolerance=180; fi;
          now=$$(date +%s) || exit 1;
          for path in /tmp/payment-proof-maintenance-last-success /tmp/payment-proof-alert-last-success; do
          test -s "$$path" || exit 1;
          marker=$$(cat "$$path") || exit 1;
          case "$$marker" in ''|*[!0-9]*) exit 1;; esac;
          test "$$marker" -le $$((now + 5)) || exit 1;
          age=$$((now - marker));
          test "$$age" -le "$$tolerance" || exit 1;
          done
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    networks: [app-private]


  notification-outbox-maintenance:
    image: alpine:3.20
    container_name: asados-notification-outbox-maintenance
    restart: always
    environment:
      - NOTIFICATION_OUTBOX_MAINTENANCE_SECRET=${NOTIFICATION_OUTBOX_MAINTENANCE_SECRET:?set NOTIFICATION_OUTBOX_MAINTENANCE_SECRET}
      - NOTIFICATION_OUTBOX_MAINTENANCE_URL=http://web:3000/api/internal/notifications/maintenance
      - NOTIFICATION_OUTBOX_MAINTENANCE_INTERVAL_SECONDS=${NOTIFICATION_OUTBOX_MAINTENANCE_INTERVAL_SECONDS:-60}
      # Dispatch is at-least-once; leave all provider gates closed until explicitly enabled.
      - NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      - WEB_NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${WEB_NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      - WHATSAPP_NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${WHATSAPP_NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
      - TELEGRAM_NOTIFICATION_OUTBOX_DISPATCH_ENABLED=${TELEGRAM_NOTIFICATION_OUTBOX_DISPATCH_ENABLED:-false}
    command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec /scheduler/notification-outbox-maintenance-scheduler.sh"]
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - ./ops/notification-outbox-maintenance-scheduler.sh:/scheduler/notification-outbox-maintenance-scheduler.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          interval=$${NOTIFICATION_OUTBOX_MAINTENANCE_INTERVAL_SECONDS:-60};
          case "$$interval" in ''|*[!0-9]*) interval=60;; *)
          if [ "$$interval" -lt 1 ] || [ "$$interval" -gt 715827882 ]; then interval=60; fi;; esac;
          tolerance=$$((interval * 3)); if [ "$$tolerance" -lt 180 ]; then tolerance=180; fi;
          now=$$(date +%s) || exit 1; marker=$$(cat /tmp/notification-outbox-maintenance-last-success) || exit 1;
          case "$$marker" in ''|*[!0-9]*) exit 1;; esac;
          test "$$marker" -le $$((now + 5)) && test $$((now - marker)) -le "$$tolerance"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    networks: [app-private]

  sofia-inbound-batch-maintenance:
    image: alpine:3.20
    container_name: asados-sofia-inbound-batch-maintenance
    restart: always
    environment:
      - SOFIA_BATCH_MAINTENANCE_SECRET=${SOFIA_BATCH_MAINTENANCE_SECRET:?set SOFIA_BATCH_MAINTENANCE_SECRET}
      - SOFIA_BATCH_MAINTENANCE_URL=http://web:3000/api/internal/sofia/inbound-batches/maintenance
      - SOFIA_BATCH_MAINTENANCE_INTERVAL_SECONDS=${SOFIA_BATCH_MAINTENANCE_INTERVAL_SECONDS:-2}
      - SOFIA_BATCH_MAINTENANCE_MARKER_PATH=${SOFIA_BATCH_MAINTENANCE_MARKER_PATH:-/tmp/sofia-inbound-batch-maintenance-last-success}
    command: ["/bin/sh", "-c", "apk add --no-cache curl >/dev/null && exec /bin/sh /scheduler/sofia-inbound-batch-maintenance-scheduler.sh"]
    depends_on:
      web: { condition: service_healthy }
    volumes:
      - ./ops/sofia-inbound-batch-maintenance-scheduler.sh:/scheduler/sofia-inbound-batch-maintenance-scheduler.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          interval=$${SOFIA_BATCH_MAINTENANCE_INTERVAL_SECONDS:-2};
          case "$$interval" in ''|*[!0-9]*) interval=2;; *)
          if [ "$$interval" -lt 1 ] || [ "$$interval" -gt 715827882 ]; then interval=2; fi;; esac;
          tolerance=$$((interval * 3)); if [ "$$tolerance" -lt 180 ]; then tolerance=180; fi;
          marker_path=$${SOFIA_BATCH_MAINTENANCE_MARKER_PATH:-/tmp/sofia-inbound-batch-maintenance-last-success};
          now=$$(date +%s) || exit 1; marker=$$(cat "$$marker_path") || exit 1;
          case "$$marker" in ''|*[!0-9]*) exit 1;; esac;
          test "$$marker" -le $$((now + 5)) && test $$((now - marker)) -le "$$tolerance"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 70s
    networks: [app-private]

  evolution-api:
    # Production remains on the latest verified stable release by default.
    # Use EVOLUTION_API_VERSION=2.4.0-rc2 only in the compatibility laboratory;
    # keep WHATSAPP_INTERACTIVE_CAROUSEL_ENABLED=false until the matrix passes.
    image: evoapicloud/evolution-api:${EVOLUTION_API_VERSION:-v2.3.7}
    container_name: asados-evolution-api
    restart: always
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      - SERVER_PORT=8080
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - PRISMA_HIDE_UPDATE_MESSAGE=true
      - SERVER_URL=http://evolution-api:8080
      - CORS_ORIGIN=https://crmsofiamanager.duckdns.org
      - CORS_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - CORS_CREDENTIALS=true
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY}
      - LOG_LEVEL=ERROR
      - LOG_BAILEYS=fatal
      - LOG_COLOR=false
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:?set EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=${EVOLUTION_DATABASE_CLIENT_NAME:-evolution}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/0
      - CACHE_REDIS_TTL=604800
      - CACHE_REDIS_PREFIX_KEY=asados_evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      # Evolution 2.3.7 cannot attach headers to the global webhook.
      # The authenticated instance webhook is provisioned after startup.
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_SEND_MESSAGE=true
      - WEBHOOK_REQUEST_TIMEOUT_MS=60000
      - WEBHOOK_RETRY_MAX_ATTEMPTS=5
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    volumes:
      - evolution_store:/evolution/store
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/',{headers:{Origin:'https://crmsofiamanager.duckdns.org'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    labels:
      com.asados.health.liveness: "http://127.0.0.1:8080/"
      com.asados.health.readiness: "http://127.0.0.1:8080/"
    networks:
      - app-private

  evolution-redis:
    image: redis:7-alpine
    container_name: asados-evolution-redis
    restart: always
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - evolution_redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - app-private

  evolution-db:
    image: postgres:16-alpine
    container_name: asados-evolution-db
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:?set EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    networks:
      - app-private

volumes:
  evolution_store:
  evolution_db_data:
  evolution_redis_data:

networks:
  app-private:
    name: asados-app-private
  supabase-private:
    name: asados-supabase-private
    external: true
  portafolio-net:
    name: portafolio_default
    external: true
